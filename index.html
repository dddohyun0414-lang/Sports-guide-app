<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>럭비 부상 예방 운동 가이드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0c11;--panel:#12151d;--card:#1a1e29;--line:#252a38;--tx:#eef1f6;--mu:#8b93a7;--cy:#19c8f0;--or:#ff6b35;--body:#2a3042;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.55}
header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header small{color:var(--cy);letter-spacing:.14em;font-weight:700;font-size:12px}
h1{margin:0;font-size:24px}
.hint{border:1px solid var(--cy);color:var(--cy);background:#0e2a33;border-radius:99px;padding:6px 14px;font-size:13px}
main{display:flex;flex-wrap:wrap;min-height:calc(100vh - 80px)}
.map{flex:1 1 320px;display:flex;flex-direction:column;align-items:center;padding:20px 10px}
.map svg{width:100%;max-width:300px;height:auto;touch-action:manipulation}
.r{fill:var(--body);stroke:#3a4157;stroke-width:1.5;cursor:pointer;transition:fill .15s}
.r.hr{stroke:#7a4a36}
.r:hover{fill:#3a4560}
.r.on{fill:rgba(25,200,240,.45);stroke:var(--cy);stroke-width:2.5}
.r.hr.on{fill:rgba(255,107,53,.45);stroke:var(--or)}
.r:focus-visible{outline:none;stroke:#fff;stroke-width:3}
.head{fill:#232838;stroke:#3a4157;stroke-width:1.5}
svg text{fill:#8b93a7;font-size:11px;font-weight:700;pointer-events:none;text-anchor:middle;letter-spacing:.08em}
.legend{display:flex;gap:18px;color:var(--mu);font-size:14px;margin-top:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.side{flex:1 1 340px;background:var(--panel);border-left:1px solid var(--line);padding:24px 20px}
.empty{text-align:center;padding:30px 0 10px}
.empty .ic{width:92px;height:92px;border-radius:50%;background:#0e2a33;border:1px solid var(--cy);margin:0 auto 16px;display:grid;place-items:center;font-size:36px}
.empty p{color:var(--mu);margin:6px 0}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:22px}
.list b{display:block;margin-bottom:8px}
.list button{display:flex;align-items:center;width:100%;background:none;border:0;color:var(--mu);font:inherit;padding:9px 4px;text-align:left;cursor:pointer;min-height:44px}
.list button:active{color:var(--tx)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h2{margin:0;font-size:22px}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--cy);color:var(--cy)}
.badge.hr{border-color:var(--or);color:var(--or)}
.back{margin-left:auto;background:none;border:1px solid var(--line);color:var(--mu);border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.sub{color:var(--mu);margin:6px 0 16px;font-size:14px}
.tabs{display:flex;gap:8px;background:var(--card);padding:5px;border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;min-height:46px;border:0;border-radius:9px;background:none;color:var(--mu);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.tabs button.on{background:var(--cy);color:#04141a}
.hrp .tabs button.on{background:var(--or);color:#1a0900}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.ex h3{margin:0 0 4px;font-size:17px}
.ex p{margin:6px 0;color:#c5cbda;font-size:14.5px}
.tip{color:var(--mu)!important;font-size:13.5px!important}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.dose{font-size:13px;color:var(--cy);background:#0e2a33;padding:4px 10px;border-radius:8px}
.hrp .dose{color:var(--or);background:#2a150c}
.vid{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;background:#fff;color:#111;text-decoration:none;font-weight:700;font-size:14px}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;color:var(--mu);font-size:14px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--cy)}
.ex.done{opacity:.55}
.prog{color:var(--mu);font-size:13px;margin:0 0 12px}
@media(max-width:700px){.side{border-left:0;border-top:1px solid var(--line)}}

[hidden]{display:none!important}
button.hint{font:inherit;font-size:13px;cursor:pointer;min-height:44px}
.nav{display:flex;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.nav button{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mu);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.nav button.on{background:var(--cy);color:#04141a;border-color:var(--cy)}
.setup{max-width:460px;margin:0 auto;padding:36px 20px}
.setup h2{font-size:24px;margin:0 0 6px}.setup p{color:var(--mu);margin:0 0 22px}
.fld{margin-bottom:16px}.fld label{display:block;font-size:14px;color:var(--mu);margin-bottom:6px}
.fld input{width:100%;min-height:54px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--tx);font:inherit;font-size:20px;padding:0 16px}
.fld input:focus{outline:2px solid var(--cy);border-color:var(--cy)}
.go{width:100%;min-height:56px;border:0;border-radius:12px;background:var(--cy);color:#04141a;font:inherit;font-weight:700;font-size:17px;cursor:pointer;margin-top:6px}
.err{color:var(--or);font-size:14px;min-height:20px}
.me{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--mu);margin:0 0 14px}
.dietv{max-width:760px;margin:0 auto;padding:24px 20px 40px}
.dietv h2{margin:0 0 4px;font-size:22px}
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.tg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.tg b{display:block;font-size:22px;color:var(--cy)}.tg span{font-size:13px;color:var(--mu)}
.meal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.meal h3{margin:0;font-size:17px}.meal .t{font-size:13px;color:var(--cy)}
.meal ul{margin:8px 0;padding-left:18px;color:#c5cbda;font-size:14.5px}
.fx{background:#0e2a33;border-radius:10px;padding:10px 12px;font-size:14px;color:#bfeaf5}
.sec{margin:26px 0 10px;font-size:18px}
.fxg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.note{color:var(--mu);font-size:13px;margin-top:18px}

.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}
.goal{display:flex;flex-direction:column;gap:6px;text-align:left;min-height:150px;padding:16px;background:var(--card);border:2px solid var(--line);border-radius:16px;color:var(--tx);font:inherit;cursor:pointer}
.goal.on,.goal:active{border-color:var(--cy)}
.goal .gi{font-size:30px}.goal b{font-size:18px}
.goal span{font-size:14px;color:#c5cbda}
.goal .ex2{color:var(--cy);font-size:13.5px}
.goal em{font-style:normal;font-size:13px;color:var(--mu)}
.warn{border:1px solid var(--or);color:#ffc2a8;background:#2a150c;border-radius:12px;padding:12px 14px;font-size:14px;margin:12px 0}
.foods{list-style:none;margin:10px 0;padding:0}
.foods li{padding:10px 0;border-top:1px solid var(--line)}
.foods li:first-child{border-top:0}
.foods b{font-size:15.5px}.amt{color:var(--cy);font-size:14px;margin-left:6px}
.eff{color:var(--mu);font-size:13.5px;margin-top:2px}
.tipl{margin:6px 0 0;padding-left:18px;color:#c5cbda;font-size:14.5px}

.steps{margin:8px 0;padding-left:20px;color:#c5cbda;font-size:14.5px}
.steps li{margin:4px 0}
.src{margin:8px 0 0;padding-left:20px;font-size:13px;color:var(--mu)}
.src a{color:var(--cy)}
.why{margin:6px 0 0;padding-left:18px;color:#c5cbda;font-size:14.5px}
</style></head>
<body>
<header><div><small>RUGBY PERFORMANCE</small><h1>부상 예방 운동 가이드</h1></div><button class="hint" id="prof" type="button">내 정보 입력</button></header>
<nav class="nav" id="nav" hidden><button data-v="exv">운동</button><button data-v="diet">식단</button></nav>
<section id="setup" class="setup" hidden><h2>먼저 내 정보를 알려주세요</h2><p>키와 체중에 맞춰 운동 권장 횟수와 식단 목표를 계산해 드려요.</p>
<div class="fld"><label for="hh">키 (cm)</label><input id="hh" type="number" inputmode="decimal" placeholder="예: 175"></div>
<div class="fld"><label for="ww">체중 (kg)</label><input id="ww" type="number" inputmode="decimal" placeholder="예: 70"></div>
<div class="err" id="err" role="alert"></div><button class="go" id="go" type="button">시작하기</button></section>
<main id="exv" hidden>
<section class="map">
<svg viewBox="0 0 300 840" role="group" aria-label="신체 부위 선택">
<circle class="head" cx="150" cy="68" r="58"/>
<circle cx="132" cy="60" r="6" fill="#3a4157"/><circle cx="168" cy="60" r="6" fill="#3a4157"/>
<g id="regions">

<ellipse class="r" data-k="shoulder" cx="252" cy="200" rx="40" ry="30" tabindex="0"/>

<rect class="r" data-k="arm" x="8" y="238" width="46" height="112" rx="20" tabindex="0"/>
<rect class="r" data-k="arm" x="246" y="238" width="46" height="112" rx="20" tabindex="0"/>
<rect class="r" data-k="arm" x="10" y="352" width="40" height="100" rx="18" tabindex="0"/>
<rect class="r" data-k="arm" x="250" y="352" width="40" height="100" rx="18" tabindex="0"/>
<rect class="r" data-k="hip" x="62" y="410" width="176" height="96" rx="30" tabindex="0"/>

<rect class="r" data-k="thigh" x="160" y="508" width="76" height="150" rx="22" tabindex="0"/>
<ellipse class="r hr" data-k="knee" cx="100" cy="672" rx="38" ry="28" tabindex="0"/>
<ellipse class="r hr" data-k="knee" cx="200" cy="672" rx="38" ry="28" tabindex="0"/>

<ellipse class="r hr" data-k="ankle" cx="200" cy="822" rx="34" ry="14" tabindex="0"/>
</g>
<text x="150" y="156">NECK</text><text x="150" y="196">SHOULDER</text><text x="150" y="240">CHEST</text><text x="150" y="350">CORE</text><text x="150" y="462">HIP</text>
<text x="102" y="590">THIGH</text><text x="198" y="590">THIGH</text><text x="100" y="676">KNEE</text><text x="200" y="676">KNEE</text><text x="101" y="752">ANKLE</text><text x="199" y="752">ANKLE</text><text x="31" y="299" transform="rotate(-90 31 299)">ARM</text><text x="269" y="299" transform="rotate(90 269 299)">ARM</text>
</svg>
<div class="legend"><span><i class="dot" style="background:var(--cy)"></i>일반 부위</span><span><i class="dot" style="background:var(--or)"></i>고위험 부위</span></div>
</section>
<section class="side" id="side" aria-live="polite"></section>
</main>
<section id="diet" class="dietv" hidden></section>
<script>
// [부위, 고위험, 소개, 스트레칭[[이름,설명,팁,분량]], 근력[[...]]]
const D={
neck:["목 / 경추",0,"태클과 스크럼에서 충격을 가장 먼저 받는 곳이에요. 유연함보다 버티는 힘이 중요해요.",
[["목 옆으로 늘리기","의자에 허리를 펴고 앉아요|왼손을 머리 오른쪽 위에 얹고 머리를 왼쪽으로 부드럽게 기울여요|목 오른쪽이 늘어나는 느낌에서 멈추고 버텨요","반대쪽 어깨는 아래로 힘을 빼요","20초 × 양쪽 2회","목 옆 스트레칭"],["턱 당겨서 뒷목 늘리기","서거나 앉아서 정면을 봐요|턱을 뒤로 살짝 당겨 이중턱을 만들어요|뒷목이 길어지는 느낌에서 버텨요","고개를 숙이지 말고 수평으로 당겨요","15초 × 3회","턱 당기기 chin tuck"]],
[["손으로 막고 목에 힘주기","이마에 손바닥을 대요|손으로 밀고, 목으로 버티되 고개는 움직이지 않아요|앞, 옆, 뒤 방향으로 돌아가며 해요","숨을 참지 말고 천천히 쉬어요","8초 × 방향별 3회","목 등척성 운동"],["밴드로 뒷목 힘 키우기","밴드를 머리 뒤에 걸고 양손으로 잡아요|턱을 당긴 채 머리로 밴드를 천천히 뒤로 눌러요|천천히 돌아와요","허리가 꺾이지 않게 배에 힘을 줘요","12회 × 3세트","밴드 목 운동"]]],
shoulder:["어깨 / 회전근개",0,"탈구와 어깨 힘줄 부상이 잦은 곳이에요. 흔들리지 않게 잡아주는 힘이 핵심이에요.",
[["한 팔 가슴 앞으로 당기기","한쪽 팔을 가슴 앞으로 쭉 펴요|반대 팔로 팔꿈치 부근을 몸쪽으로 당겨요|어깨 뒤쪽이 늘어나면 버텨요","어깨가 귀 쪽으로 올라가지 않게 해요","30초 × 양쪽 2회","어깨 크로스바디 스트레칭"],["문틀에 기대 어깨 앞 늘리기","문틀에 팔꿈치를 90도로 굽혀 대요|한 발을 앞으로 내딛으며 몸을 앞으로 밀어요|가슴과 어깨 앞이 늘어나면 버텨요","허리를 과하게 젖히지 않아요","30초 × 3회","도어웨이 스트레칭"]],
[["밴드 바깥으로 돌리기","팔꿈치를 옆구리에 붙이고 90도로 굽혀요|밴드를 잡고 손을 바깥으로 천천히 돌려요|천천히 돌아와요","팔꿈치가 몸에서 떨어지지 않게 해요","15회 × 3세트","밴드 어깨 외회전"],["엎드려서 팔 들기","엎드려서 이마를 바닥에 가볍게 대요|팔을 Y, T, W 모양으로 차례로 들어 올려요|날개뼈를 모으는 느낌으로 내려요","가벼운 무게로 천천히 해요","각 8회 × 2세트","YTW 레이즈"]]],
chest:["가슴 / 흉곽",0,"볼을 들고 달리고 미는 힘의 바탕이에요. 어깨 자세도 함께 잡아줘요.",
[["벽에 손 대고 가슴 열기","벽에 팔을 어깨 높이로 뻗어 손바닥을 대요|몸을 반대쪽으로 천천히 돌려요|가슴 앞이 늘어나면 버텨요","갈비뼈가 튀어나오지 않게 배에 힘을 줘요","30초 × 양쪽 2회","벽 가슴 스트레칭"],["옆으로 누워 가슴 돌리기","옆으로 누워 무릎을 90도로 굽혀 붙여요|위쪽 팔을 크게 펼치며 가슴을 천장으로 열어요|천천히 돌아와요","무릎이 벌어지지 않게 해요","10회 × 2세트","오픈북 흉추 회전"]],
[["팔굽혀펴기","손은 어깨보다 조금 넓게 바닥에 짚어요|머리부터 발끝까지 일직선으로 내려가요|가슴이 바닥 가까이 가면 밀어 올려요","힘들면 무릎을 대고 해도 좋아요","12회 × 3세트","푸시업 올바른 자세"],["누워서 덤벨 밀기","바닥에 누워 덤벨을 가슴 위에 잡아요|팔꿈치를 몸에서 45도 정도 벌려 내려요|천천히 위로 밀어 올려요","팔꿈치가 너무 옆으로 벌어지지 않게 해요","10회 × 3세트","덤벨 플로어 프레스"]]],

const WHY={

cut:[['한 주에 0.2~0.7kg(0.5~1.5파운드) 정도로 천천히 빼는 걸 권장해요.',[3]],['채소를 먼저 담고, 껍질 없는 닭고기·생선·저지방 유제품 같은 살코기 단백질과 곡물을 더해요.',[3]],['음료는 물이나 저지방 우유를 고르면 열량을 쉽게 줄일 수 있어요.',[3]]],
keep:[['보통 강도로 훈련할 때 탄수화물은 체중 1kg당 하루 5~7g이 일반적인 가이드예요.',[4]],['피로는 스포츠 부상의 위험 요인이고, 알맞은 식사가 피로를 줄이고 회복을 도와요.',[8]],['단백질은 근육 수리에 쓰이고, 지방은 너무 많이 먹지 않는 게 좋아요.',[8]]],
rec:[['부상 회복기에는 에너지를 부족하지 않게 먹고, 단백질과 탄수화물이 풍부한 식사가 도움이 된다고 정리돼 있어요.',[5,6]],['고등어·참치 같은 생선의 오메가-3는 근육 단백질 합성에 도움이 될 수 있어요.',[5,7]],['아연은 상처 회복에 쓰이고, 비타민 C는 콜라겐(힘줄·인대의 재료)을 만드는 데 필요해요.',[7,9]],['술은 근육 단백질 합성을 방해해요.',[7]]]};
let G=ST.get('rg_g'),T=0;
const parse=q=>q.split('/').map(m=>{const p=m.split('=');return [p[0],p[1].split(',').map(x=>{const k=x.indexOf(':');return [x.slice(0,k),x.slice(k+1)]})]});
function goalScreen(){
 $('diet').innerHTML=`<h2>운동 목적을 골라 주세요</h2><p class="sub">목적에 따라 식단의 음식과 양이 모두 달라져요. 하나를 터치하세요.</p><div class="goals">`+
 GK.map(k=>{const g=GOALS[k];return `<button class="goal ${G===k?'on':''}" data-g="${k}"><span class="gi">${g[0]}</span><b>${g[1]}</b><span>${g[2]}</span><span class="ex2">${g[3]}</span><em>${g[6]}</em></button>`}).join('')+`</div>`;
 $('diet').querySelectorAll('.goal').forEach(b=>b.onclick=()=>{G=b.dataset.g;ST.set('rg_g',G);T=0;renderDiet();scrollTo(0,0)});
}
function renderDiet(){
 const g=GOALS[G],w=P.w,b=bmi(),r=Math.round,t=DIETS[G][T],meals=parse(t[2]);
 const warn=G==='cut'&&b<18.5?'<div class="warn">BMI가 낮은 편이라 체중을 더 줄이는 것보다 "경기력 유지"나 "벌크업" 목적을 추천해요.</div>':'';
 $('diet').innerHTML=`<div class="top"><h2>${g[0]} ${g[1]}</h2><button class="back" id="chg">목적 바꾸기</button></div>
 <p class="sub">체중 ${w}kg 기준 · ${g[6]}</p>${warn}
 <div class="targets"><div class="tg"><b>${r(w*g[4][0])}~${r(w*g[4][1])}g</b><span>하루 단백질</span></div><div class="tg"><b>${r(w*g[5][0])}~${r(w*g[5][1])}g</b><span>하루 탄수화물</span></div><div class="tg"><b>${(w*.035).toFixed(1)}L</b><span>하루 수분 (훈련 시 +0.5~1L)</span></div></div>
 <h3 class="sec">식단 종류 선택</h3>
 <div class="tabs">${DIETS[G].map((x,i)=>`<button data-t="${i}" class="${i===T?'on':''}">${x[0]}</button>`).join('')}</div>
 <p class="sub">${t[1]}</p>`+
 meals.map(m=>{const tags=[...new Set(m[1].map(x=>FOOD[x[0]][1]))].join(' · ');
 return `<article class="meal"><span class="t">${m[0]}</span><ul class="foods">${m[1].map(x=>`<li><b>${x[0]}</b><span class="amt">${x[1]}</span><div class="eff">${FOOD[x[0]][0]}</div></li>`).join('')}</ul><div class="fx">✔ 기대효과: ${tags}에 도움이 될 수 있어요.</div></article>`}).join('')+
 `<h3 class="sec">${g[1]} 목적 체크포인트</h3><ul class="tipl">${g[7].map(x=>`<li>${x}</li>`).join('')}</ul>
 <h3 class="sec">꾸준히 먹으면 기대되는 효과</h3><div class="fxg">${g[8].map(x=>`<div class="meal"><h3>${x}</h3></div>`).join('')}</div>
 <h3 class="sec">왜 이렇게 구성했나요?</h3><ul class="why">${WHY[G].map(x=>`<li>${x[0]} ${x[1].map(n=>`<sup>[${n}]</sup>`).join('')}</li>`).join('')}</ul>
 <h3 class="sec">참고한 자료</h3><ol class="src">${SRC.map(x=>`<li><a href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a></li>`).join('')}</ol>
 <p class="note">스포츠영양 기관과 연구 자료의 일반 원칙을 바탕으로 만든 참고용이에요. 식품별 설명은 일반적인 영양 지식이고, 벌크업·다이어트의 탄수화물 범위는 자료의 원칙에 맞춰 조정한 값이에요. 알레르기나 질환이 있다면 의사·영양사와 상담해 주세요.</p>`;
 $('chg').onclick=goalScreen;
 $('diet').querySelectorAll('.tabs button').forEach(x=>x.onclick=()=>{T=+x.dataset.t;renderDiet()});
}
shapes.forEach(s=>{s.onclick=()=>show(s.dataset.k,'s');s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(s.dataset.k,'s')}}});
upd();empty();view(P?'exv':'setup');
